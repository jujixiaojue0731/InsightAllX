# insightAllX — macOS-only build (unsigned), manual trigger.
# Forked repo has no Apple signing secrets, so this produces an unsigned dmg/zip.
# Kept separate from release.yml so Windows SignPath / OSS upload don't block it.

name: Build macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Prefer HTTPS for public GitHub git dependencies
        run: |
          git config --global "url.https://github.com/.insteadOf" "git@github.com:"
          git config --global --add "url.https://github.com/.insteadOf" "ssh://git@github.com/"

      - name: Install dependencies
        run: pnpm install

      - name: Download uv binaries for macOS
        run: pnpm run uv:download:mac

      - name: Download agent-browser binaries for macOS
        run: pnpm run agent-browser:download:mac

      - name: Free disk space (macOS)
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/share/chromium || true
          sudo rm -rf /usr/local/lib/node_modules || true
          rm -rf ~/Library/Caches/electron-builder/dmg-builder* || true
          brew cleanup --prune=all 2>/dev/null || true

      - name: Build macOS
        run: |
          ulimit -n 65536
          pnpm run package:mac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-unsigned
          path: |
            release/*.dmg
            release/*.zip
          retention-days: 7
