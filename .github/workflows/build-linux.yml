# InsightAll — Linux-only build (unsigned), manual trigger.

name: Build Linux

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Prefer HTTPS for public GitHub git dependencies
        run: |
          git config --global "url.https://github.com/.insteadOf" "git@github.com:"
          git config --global --add "url.https://github.com/.insteadOf" "ssh://git@github.com/"

      - name: Install dependencies
        run: pnpm install

      - name: Download uv binaries for Linux
        run: pnpm run uv:download:linux

      - name: Download agent-browser binaries for Linux
        run: pnpm run agent-browser:download:linux

      - name: Build Linux
        run: pnpm run package:linux

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: release/*.AppImage
          retention-days: 7

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: release/*.deb
          retention-days: 7

      - name: Upload rpm
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: release/*.rpm
          retention-days: 7
